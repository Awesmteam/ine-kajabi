<!-- ============================================================
     AB5 Workshop — Payment choice section "Velg betalingsmåte"
     One section, two payment options (the two original CTAs).
     Self-contained: paste into a Kartra Custom HTML/JS element.
     Norwegian copy. id=ab5-betaling (scroll target for the single CTA).
     ============================================================ -->
<section class="ab5-pay" id="ab5-betaling">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
    .ab5-pay{
      --paper:#f4efe7;--ink:#23263a;--muted:#5c6072;--indigo:#2b2d5c;
      --violet:#6d5ca6;--accent:#e8743b;--accent-d:#cf5d27;
      --card:#fffdf9;--line:#e7ddcd;
      --serif:"Fraunces",Georgia,"Times New Roman",serif;
      --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
      font-family:var(--sans);color:var(--ink);
      background:
        radial-gradient(1000px 380px at 50% -10%, #efe6f3 0%, rgba(239,230,243,0) 60%),
        var(--paper);
      padding:60px 20px;display:flex;justify-content:center;
      box-sizing:border-box;-webkit-font-smoothing:antialiased;
      scroll-margin-top:72px;
    }
    .ab5-pay *{box-sizing:border-box;}

    .ab5-pay__card{
      width:100%;max-width:720px;text-align:center;
      background:var(--card);border:1px solid var(--line);border-radius:24px;
      box-shadow:0 28px 64px -34px rgba(43,45,92,.55);
      padding:44px 36px 40px;
    }
    .ab5-pay__kicker{
      font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
      color:var(--violet);margin:0 0 10px;
    }
    .ab5-pay h2{
      font-family:var(--serif);font-weight:600;
      font-size:clamp(26px,3vw,34px);line-height:1.12;letter-spacing:-.01em;
      color:var(--indigo);margin:0 0 18px;
    }
    .ab5-pay__price{
      display:flex;align-items:baseline;justify-content:center;gap:12px;margin:0 0 6px;
    }
    .ab5-pay__old{font-size:15px;color:var(--muted);text-decoration:line-through;white-space:nowrap;}
    .ab5-pay__now{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1;color:var(--indigo);}
    .ab5-pay__now small{font-size:17px;font-weight:600;}
    .ab5-pay__meta{font-size:13.5px;color:var(--muted);margin:0 0 26px;}

    .ab5-pay__choose{
      font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
      color:var(--muted);margin:0 0 16px;
    }
    .ab5-pay__opts{
      display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;
    }
    .ab5-pay__cta{
      display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
      background:var(--accent);color:#fff;font-weight:700;font-size:16px;
      padding:16px 30px;border-radius:999px;min-height:54px;
      box-shadow:0 12px 24px -10px rgba(232,116,59,.7);
      transition:transform .12s ease, background .12s ease;
    }
    .ab5-pay__cta:hover{background:var(--accent-d);transform:translateY(-1px);}
    .ab5-pay__or{font-size:13px;font-weight:600;color:var(--muted);}
    .ab5-pay__vipps{display:inline-flex;align-items:center;transition:transform .12s ease;}
    .ab5-pay__vipps:hover{transform:translateY(-1px);}
    .ab5-pay__vipps img{height:54px;width:auto;display:block;border-radius:999px;
      box-shadow:0 12px 24px -12px rgba(255,91,32,.6);}

    .ab5-pay__trust{font-size:13.5px;color:var(--muted);margin:24px 0 0;}

    @media (max-width:560px){
      .ab5-pay{padding:40px 14px;}
      .ab5-pay__card{padding:32px 20px 30px;}
      .ab5-pay__price{flex-direction:column;gap:2px;}
      .ab5-pay__now{font-size:34px;}
      .ab5-pay__opts{flex-direction:column;}
      .ab5-pay__cta{width:100%;}
      .ab5-pay__vipps{width:100%;justify-content:center;}
    }
  </style>

  <div class="ab5-pay__card">
    <p class="ab5-pay__kicker">Sikre plassen din</p>
    <h2>Velg hvordan du vil betale</h2>

    <div class="ab5-pay__price">
      <span class="ab5-pay__old">Vanlig pris: 3,500 kr.</span>
      <span class="ab5-pay__now">kun 149&nbsp;<small>kr</small></span>
    </div>
    <p class="ab5-pay__meta">📅 6.-8. juli · ⏰ kl. 19:00 · 🏠 online fra din egen stue</p>

    <p class="ab5-pay__choose">Velg betalingsmåte</p>
    <div class="ab5-pay__opts">
      <a class="ab5-pay__cta" href="https://pages.checkoutjoy.com/3-d-w-a" target="_blank">Betal med kort</a>
      <span class="ab5-pay__or">eller</span>
      <a class="ab5-pay__vipps" href="https://pages.checkoutjoy.com/3-d-w-s" target="_blank" aria-label="Betal med Vipps">
        <img src="https://d11n7da8rpqbjy.cloudfront.net/kunstpalett/39704505712vipps_pay__2_.png" alt="Betal med Vipps">
      </a>
    </div>

    <p class="ab5-pay__trust">Kun 149 kr · Ingen bindingstid · Opptak i 5 dager</p>
  </div>
</section>
