<!-- ============================================================
     AB5 Workshop — Section 12: "Se hva våre studenter har oppnådd:"
     Gallery wall of framed paintings; hover = gentle zoom-in.
     Self-contained: paste into a Kartra Custom HTML/JS element.
     Norwegian copy kept verbatim.
     ============================================================ -->
<section class="ab5-wall">
  <style>
    .ab5-wall{
      --ink:#23263a;--indigo:#2b2d5c;--muted:#5c6072;
      --wall1:#e7dcc8;--wall2:#dccdb4;--frame:#2c241d;--mat:#fbf7ef;--plaque:#b89b6b;
      --serif:"Fraunces",Georgia,"Times New Roman",serif;
      --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
      font-family:var(--sans);color:var(--ink);
      background:linear-gradient(180deg,var(--wall1) 0%,var(--wall2) 100%);
      padding:56px 20px;display:flex;justify-content:center;
      box-sizing:border-box;-webkit-font-smoothing:antialiased;
    }
    .ab5-wall *{box-sizing:border-box;}
    .ab5-wall__inner{width:100%;max-width:1080px;}

    .ab5-wall h2{
      font-family:var(--serif);font-weight:600;
      font-size:clamp(26px,3.1vw,36px);line-height:1.12;letter-spacing:-.01em;
      color:var(--indigo);text-align:center;margin:0 0 8px;
    }
    /* picture rail */
    .ab5-wall__rail{height:3px;background:rgba(44,36,29,.18);max-width:1080px;margin:0 auto 40px;border-radius:2px;}

    .ab5-wall__grid{
      display:grid;grid-template-columns:repeat(3,1fr);gap:40px 34px;
    }

    .ab5-wall__tile{display:flex;flex-direction:column;align-items:center;}
    /* hook + cord */
    .ab5-wall__hook{width:9px;height:9px;border-radius:50%;background:#4a3d30;box-shadow:0 1px 2px rgba(0,0,0,.3);}
    .ab5-wall__cord{width:2px;height:18px;background:rgba(44,36,29,.4);margin-bottom:-1px;}

    .ab5-wall__frame{
      width:100%;background:var(--frame);
      padding:12px;border-radius:4px;
      box-shadow:0 16px 30px -14px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);
      transition:transform .3s ease, box-shadow .3s ease;
    }
    .ab5-wall__mat{background:var(--mat);padding:12px;border-radius:2px;overflow:hidden;}
    .ab5-wall__art{
      width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:1px;
      transition:transform .45s cubic-bezier(.22,.61,.36,1);
    }
    .ab5-wall__tile:hover .ab5-wall__frame{transform:translateY(-4px);box-shadow:0 26px 40px -16px rgba(0,0,0,.5);}
    .ab5-wall__tile:hover .ab5-wall__art{transform:scale(1.1);}

    .ab5-wall__plaque{
      margin-top:14px;background:var(--plaque);color:#2b2218;
      font-size:13px;font-weight:700;letter-spacing:.02em;
      padding:6px 16px;border-radius:4px;
      box-shadow:0 3px 6px -2px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4);
    }

    @media (max-width:820px){ .ab5-wall__grid{grid-template-columns:repeat(2,1fr);gap:32px 26px;} }
    @media (max-width:520px){ .ab5-wall{padding:40px 16px;} .ab5-wall__grid{grid-template-columns:1fr;max-width:300px;margin:0 auto;} }
  </style>

  <div class="ab5-wall__inner">
    <h2>Se hva våre studenter har oppnådd:</h2>
    <div class="ab5-wall__rail"></div>

    <div class="ab5-wall__grid">
      <div class="ab5-wall__tile">
        <span class="ab5-wall__hook"></span><span class="ab5-wall__cord"></span>
        <div class="ab5-wall__frame"><div class="ab5-wall__mat"><img class="ab5-wall__art" src="https://d11n7da8rpqbjy.cloudfront.net/kunstpalett/484558155200Nina_Ivanova_Bradova_2025.jpg" alt="Nina Bradova"></div></div>
        <span class="ab5-wall__plaque">Nina Bradova</span>
      </div>
      <div class="ab5-wall__tile">
        <span class="ab5-wall__hook"></span><span class="ab5-wall__cord"></span>
        <div class="ab5-wall__frame"><div class="ab5-wall__mat"><img class="ab5-wall__art" src="https://d11n7da8rpqbjy.cloudfront.net/kunstpalett/4835438768656D761FD-52D1-4B12-A8FB-A0F5AC585535_1_201_a.jpeg" alt="Solveig Sti"></div></div>
        <span class="ab5-wall__plaque">Solveig Sti</span>
      </div>
      <div class="ab5-wall__tile">
        <span class="ab5-wall__hook"></span><span class="ab5-wall__cord"></span>
        <div class="ab5-wall__frame"><div class="ab5-wall__mat"><img class="ab5-wall__art" src="https://d11n7da8rpqbjy.cloudfront.net/kunstpalett/1093144368629Lone_Breiseth.jpg" alt="Lone Breiseth"></div></div>
        <span class="ab5-wall__plaque">Lone Breiseth</span>
      </div>
      <div class="ab5-wall__tile">
        <span class="ab5-wall__hook"></span><span class="ab5-wall__cord"></span>
        <div class="ab5-wall__frame"><div class="ab5-wall__mat"><img class="ab5-wall__art" src="https://d11n7da8rpqbjy.cloudfront.net/kunstpalett/50388029284Torhild_Berg_Skjetne.jpg" alt="Torhild Berg Skjetne"></div></div>
        <span class="ab5-wall__plaque">Torhild Berg Skjetne</span>
      </div>
      <div class="ab5-wall__tile">
        <span class="ab5-wall__hook"></span><span class="ab5-wall__cord"></span>
        <div class="ab5-wall__frame"><div class="ab5-wall__mat"><img class="ab5-wall__art" src="https://d11n7da8rpqbjy.cloudfront.net/kunstpalett/319017136921Synneve_Busengdal.jpg" alt="Synneve Busengdal"></div></div>
        <span class="ab5-wall__plaque">Synneve Busengdal</span>
      </div>
      <div class="ab5-wall__tile">
        <span class="ab5-wall__hook"></span><span class="ab5-wall__cord"></span>
        <div class="ab5-wall__frame"><div class="ab5-wall__mat"><img class="ab5-wall__art" src="https://d11n7da8rpqbjy.cloudfront.net/kunstpalett/555918194186Olga_Orishchenko.jpg" alt="Olga Orishchenko"></div></div>
        <span class="ab5-wall__plaque">Olga Orishchenko</span>
      </div>
    </div>
  </div>
</section>
